syntax = "proto3";

option csharp_namespace = "Chat.Application";

package auth;

service UserProfileGrpc {
  rpc GetUserProfileById (GetUserProfileByIdRequest) returns (UserProfileGrpcResponse);
}

message GetUserProfileByIdRequest {
  string user_id = 1;
}

message UserProfileGrpcResponse {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string photo_url = 5;
  string birth_date = 6;
  string phone_number = 7;
  string country = 8;
  string city = 9;
  repeated string roles = 10;
}