syntax = "proto3";

option csharp_namespace = "Auth.Api.Grpc";

package auth;

service UserProfileGrpc {
  rpc GetUserProfileById (GetUserProfileByIdRequest) returns (UserProfileGrpcResponse);

  rpc GetUserProfilesByIds (GetUserProfilesByIdsRequest) returns (GetUserProfilesByIdsResponse);
}

message GetUserProfileByIdRequest {
  string user_id = 1;
}

message GetUserProfilesByIdsRequest {
  repeated string user_ids = 1;
}

message GetUserProfilesByIdsResponse {
  repeated UserProfileGrpcResponse profiles = 1;
  repeated string not_found_user_ids = 2;
}

message UserProfileGrpcResponse {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string photo_url = 5;
  string birth_date = 6;
  string phone_number = 7;
  string country = 8;
  string city = 9;
  repeated string roles = 10;
}