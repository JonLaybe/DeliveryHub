version: "3.9"

networks:
    order_service_network:
        driver: bridge

services:
  order-service-webapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-service-webapi
    ports:
      - "8080:8080"
    environment:
        POSTGRES_DB_PORT: "5432"
        POSTGRES_DB_HOST: "localhost"
        POSTGRES_PASSWORD:
        POSTGRES_USER: postgres
        POSTGRES_DB: OrderDb
    networks:
      - order_service_network